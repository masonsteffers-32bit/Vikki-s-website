  <script>
    // Mobile menu
    const navToggle = document.getElementById('navToggle');
    const navLinks = document.getElementById('navLinks');
    navToggle.addEventListener('click', () => navLinks.classList.toggle('open'));
    navLinks.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', () => navLinks.classList.remove('open'));
    });

    // Filter
    const filterBtns = document.querySelectorAll('.filter-btn');
    const galleryItems = document.querySelectorAll('.gallery-item');

    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const filter = btn.dataset.filter;

        galleryItems.forEach(item => {
          if (filter === 'all' || item.dataset.category === filter) {
            item.style.display = '';
            item.style.animation = 'none';
            item.offsetHeight; // trigger reflow
            item.style.animation = '';
          } else {
            item.style.display = 'none';
          }
        });
      });
    });

    // Lightbox
    function openLightbox(el) {
      const img = el.querySelector('img');
      const title = el.querySelector('h4')?.textContent || '';
      const category = el.querySelector('.gallery-item-info span')?.textContent || '';
      const lightbox = document.getElementById('lightbox');
      document.getElementById('lightboxImg').src = img.src.replace('w=700', 'w=1600');
      document.getElementById('lightboxTitle').textContent = title;
      document.getElementById('lightboxCategory').textContent = category;
      lightbox.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('active');
      document.body.style.overflow = '';
    }

    // Close on background click
    document.getElementById('lightbox').addEventListener('click', (e) => {
      if (e.target === e.currentTarget) closeLightbox();
    });

    // Close on Escape
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeLightbox();
    });
  </script>
